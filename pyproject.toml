[project]
name = "cloud-computing-lab"
version = "0.1.0"
description = "Practical cloud computing experiments using Python, Docker, LocalStack and AWS"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = [
    "apps",
    "experiments",
]
pythonpath = [
    "apps/api",
    ".",
]

[tool.ruff]
line-length = 100
target-version = "py312"
