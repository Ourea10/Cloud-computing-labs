services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudlab
      POSTGRES_USER: cloudlab
      POSTGRES_PASSWORD: cloudlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../apps/api
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: cloudlab
      DATABASE_USER: cloudlab
      DATABASE_PASSWORD: cloudlab
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: